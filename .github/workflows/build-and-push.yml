name: Build and Push Docker Image
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    # Opt into Node.js 24 NOW to avoid deprecation warnings
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }} # Must be Docker PAT, NOT your password

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: fintantopton/clearvoicestudio:latest
          platforms: linux/amd64 # GitHub Actions runs amd64; Apple Silicon will pull this
